# GPUnlock CRM · Web principal y app (sitio de Netlify propio, base directory = web).
# El sitio de demostración (site/) sigue con el netlify.toml de la raíz.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fuentes y logos: caché larga (cambian de nombre si cambian)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Configuración y versión del APK: siempre frescas
[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/descargar/version.json"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

# El APK se sirve con su tipo correcto para que Android lo reconozca
[[headers]]
  for = "/descargar/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"

# Zonas privadas: fuera de los buscadores
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/proforma/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/consola/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# El service worker nunca debe quedar en caché (si no, las actualizaciones no llegan)
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/app/"
[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# El script que las inmobiliarias pegan en sus webs: caché corta y permitido desde cualquier sitio
[[headers]]
  for = "/embed/lead.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/embed/inventario.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
